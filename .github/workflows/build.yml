name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-2022
            cmake_args: ""
          - name: Linux
            os: ubuntu-24.04
            cmake_args: -G Ninja

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect plugins
        shell: bash
        run: |
          mkdir dist
          cp -R build/Basement_artefacts/Release/VST3/Basement.vst3 dist/
          if [ -d build/Basement_artefacts/Release/AU/Basement.component ]; then
            cp -R build/Basement_artefacts/Release/AU/Basement.component dist/
          fi
          cp -R build/Basement_artefacts/Release/Standalone/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Basement-${{ matrix.name }}
          path: dist
